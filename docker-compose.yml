# LineRoulette - basic stack. Copy .env.example to .env, set ADMIN_PASSWORD, then:
#   docker compose up -d --build
services:
  lineroulette:
    build: .
    image: lineroulette:latest
    container_name: lineroulette
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (min. 10 characters)}
      ADMIN_RESET: ${ADMIN_RESET:-0}
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      DEFAULT_LANG: ${DEFAULT_LANG:-en}
      CONTENT_LANG: ${CONTENT_LANG:-}
      DATE_FORMAT: ${DATE_FORMAT:-%Y-%m-%d}
      TIME_FORMAT: ${TIME_FORMAT:-%H:%M}
      TZ: ${TZ:-UTC}
    volumes:
      - lineroulette-data:/data

volumes:
  lineroulette-data:
